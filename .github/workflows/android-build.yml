name: Android build and emulator smoke test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-and-emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-recorder-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Boot Android emulator and smoke-test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            set -e
            adb start-server
            adb wait-for-device
            for attempt in $(seq 1 60); do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r" || true)
              if [ "$boot_completed" = "1" ]; then break; fi
              sleep 5
            done
            test "$(adb shell getprop sys.boot_completed | tr -d "\\r")" = "1"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.smartteck.smartrecorder -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell pidof com.smartteck.smartrecorder
            adb shell screencap -p /sdcard/smart-recorder-home.png
            adb pull /sdcard/smart-recorder-home.png smart-recorder-home.png
            adb logcat -d -t 5000 > smart-recorder-logcat.txt
            if grep -q "FATAL EXCEPTION" smart-recorder-logcat.txt; then
              echo "Fatal Android exception detected"
              exit 1
            fi

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-recorder-emulator-evidence
          path: |
            smart-recorder-home.png
            smart-recorder-logcat.txt
          if-no-files-found: ignore
